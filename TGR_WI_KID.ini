; =======================================================================================
; WINTERHOLD TRADE GOODS DISTRIBUTOR
; =======================================================================================

; ---------------------------------------------------------------------------------------
; WINTERHOLD GLOBAL MODIFIERS
; ---------------------------------------------------------------------------------------
; GLOBAL SURPLUS: Arcane Goods.
; Logic: The College is a magical factory.
Keyword = TGR_WI_GlobalSurplus|Misc Item|VendorItemSoulGem
Keyword = TGR_WI_GlobalSurplus|Book|VendorItemSpellTome, VendorItemScroll
Keyword = TGR_WI_GlobalSurplus|Ammo|OCF_FL_AMMO_Playable_SoulGem
; ADDED: Wildcard Safety for Scrolls (Catches modded scrolls)
Keyword = TGR_WI_GlobalSurplus|Scroll|VendorItemScroll
Keyword = TGR_WI_GlobalSurplus|Armor|*Robe, *Hood, *Mage
; Staves
Keyword = TGR_WI_GlobalSurplus|Weapon|VendorItemStaff, WeapTypeStaff
Keyword = TGR_WI_GlobalSurplus|Ingredient|FrostSalts, IceWraithTeeth

; GLOBAL DEFICIT: Survival Goods (Food, Wood, Raw Materials).
; Logic: Frozen wasteland with no trade routes. Starvation economy.
; Food (Raw and Cooked)
Keyword = TGR_WI_GlobalDeficit|Ingestible|VendorItemFood, VendorItemFoodRaw
; Crops an Bread
Keyword = TGR_WI_GlobalDeficit|Potion|TGR_IsBread
Keyword = TGR_WI_GlobalDeficit|Ingredient|TGR_IsBread
; Resources (Wood, Ore, Ingots, Leather)
Keyword = TGR_WI_GlobalDeficit|Misc Item|VendorItemFirewood, VendorItemOreIngot, VendorItemAnimalHide, VendorItemLeather
; Basic Construction
Keyword = TGR_WI_GlobalDeficit|Misc Item|*Sawn Log, *Clay, *Quarried Stone
; Warmth items
Keyword = TGR_WI_GlobalDeficit|Misc Item|TGR_IsWarmth
Keyword = TGR_WI_GlobalDeficit|Armor|TGR_IsWarmth

; ---------------------------------------------------------------------------------------
; SPECIFIC CATEGORIES
; ---------------------------------------------------------------------------------------

; COLLEGE OUTPUT (Robes & Staves)
; Logic: Enchanted robes and staves are common among students.
; Wildcards for Robes (Mage Robes, Hoods)
Keyword = TGR_WI_CollegeOutput|Armor|*Robe, *Hood, *Mage
; Staves
Keyword = TGR_WI_CollegeOutput|Weapon|VendorItemStaff, WeapTypeStaff

; FROST YIELD (Local Ingredients)
; Logic: Ice Wraiths and Frost Atronachs are native wildlife.
Keyword = TGR_WI_FrostYield|Ingredient|FrostSalts, IceWraithTeeth

; WARMTH PREMIUM (Fur & Alcohol)
; Logic: Stacks with Global Deficit. Fur Armor and Alcohol are vital.
; Fur Armor
Keyword = TGR_WI_Warmth|Armor|ArmorMaterialHide, *Fur
Keyword = TGR_WI_Warmth|Misc Item|TGR_IsWarmth
Keyword = TGR_WI_Warmth|Armor|TGR_IsWarmth
; Alcohol (Uses Helper Keyword if available, else wildcards)
Keyword = TGR_WI_Warmth|Potion|TGR_IsAlcohol
Keyword = TGR_WI_Warmth|Potion|*Ale, *Mead, *Wine, *Brandy
