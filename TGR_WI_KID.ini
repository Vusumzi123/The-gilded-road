; =======================================================================================
; The "Mage's Ruin" (Winterhold)
; WINTERHOLD TRADE GOODS DISTRIBUTOR
; =======================================================================================

; ---------------------------------------------------------------------------------------
; WINTERHOLD GLOBAL MODIFIERS
; ---------------------------------------------------------------------------------------
; Surplus: Magic & Arcana.
Keyword = TGR_WI_GlobalSurplus|Scroll|TGR_MagicArcana
Keyword = TGR_WI_GlobalSurplus|Soul Gem|TGR_MagicArcana
Keyword = TGR_WI_GlobalSurplus|Weapon|TGR_MagicArcana

; Deficit: Provisions, Construction & Fuel.
Keyword = TGR_DA_GlobalDeficit|Potion|TGR_Provisions
Keyword = TGR_WI_GlobalDeficit|Ingredient|TGR_Provisions
Keyword = TGR_WI_GlobalDeficit|Misc Item|TGR_Provisions
Keyword = TGR_WI_GlobalDeficit|Armor|TGR_Provisions
Keyword = TGR_WI_GlobalDeficit|Misc Item|TGR_ConstructionFuel

; ---------------------------------------------------------------------------------------
; SPECIFIC CATEGORIES
; ---------------------------------------------------------------------------------------

; COLLEGE OUTPUT (Robes & Staves)
; Logic: Enchanted robes and staves are common among students.
; Wildcards for Robes (Mage Robes, Hoods)
Keyword = TGR_WI_CollegeOutput|Armor|*Robe
Keyword = TGR_WI_CollegeOutput|Armor|*Hood
Keyword = TGR_WI_CollegeOutput|Armor|*Mage
; Staves
Keyword = TGR_WI_CollegeOutput|Weapon|VendorItemStaff, WeapTypeStaff

; FROST YIELD (Local Ingredients)
; Logic: Ice Wraiths and Frost Atronachs are native wildlife.
Keyword = TGR_WI_FrostYield|Ingredient|FrostSalts, IceWraithTeeth

; WARMTH PREMIUM (Fur & Alcohol)
; Logic: Stacks with Global Deficit. Fur Armor and Alcohol are vital.
; Fur Armor
Keyword = TGR_WI_Warmth|Armor|ArmorMaterialHide
Keyword = TGR_WI_Warmth|Armor|*Fur
Keyword = TGR_WI_Warmth|Misc Item|TGR_IsWarmth
Keyword = TGR_WI_Warmth|Armor|TGR_IsWarmth
; Alcohol (Uses Helper Keyword if available, else wildcards)
Keyword = TGR_WI_Warmth|Potion|TGR_IsAlcohol
Keyword = TGR_WI_Warmth|Potion|*Ale
Keyword = TGR_WI_Warmth|Potion|*Mead
Keyword = TGR_WI_Warmth|Potion|*Wine
Keyword = TGR_WI_Warmth|Potion|*Brandy
