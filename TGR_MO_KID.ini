; =======================================================================================
; MORTHAL TRADE GOODS DISTRIBUTOR
; =======================================================================================

; ---------------------------------------------------------------------------------------
; MORTHAL GLOBAL MODIFIERS
; ---------------------------------------------------------------------------------------
; GLOBAL SURPLUS: Swamp Ingredients.
; Logic: The marshes are full of fungus, roots, and lichen.
; Wildcards used to catch specific swamp flora names.
Keyword = TGR_MO_GlobalSurplus|Ingredient|*Deathbell, *Giant Lichen, *Fungal Pod, *Canis Root, *Nirnroot, *Swamp
; OCF Failsafe (If OCF has specific plant lists, but wildcards are safer here)
Keyword = TGR_MO_GlobalSurplus|Ingredient|OCF_FL_TREE_FlorPlant_Nirnroot
Keyword = TGR_MO_GlobalSurplus|Ingredient|OCF_FL_TREE_FlorPlant_Mushroom
; ADDED: Potions
Keyword = TGR_MO_GlobalSurplus|Potion|VendorItemPotion

; GLOBAL DEFICIT: Iron and Basic Tools.
; Logic: Morthal has no blacksmith.
Keyword = TGR_MO_GlobalDeficit|Weapon|WeapMaterialIron
Keyword = TGR_MO_GlobalDeficit|Armor|ArmorMaterialIron, ArmorMaterialBandedIron
; Crops an Bread
Keyword = TGR_MO_GlobalDeficit|Potion|TGR_IsBread
Keyword = TGR_MO_GlobalDeficit|Ingredient|TGR_IsBread

; ---------------------------------------------------------------------------------------
; SPECIFIC CATEGORIES
; ---------------------------------------------------------------------------------------

; TOXIC FLORA (Poisons & Ingredients)
; Logic: Dangerous ingredients are common; Poisons are cheap to make but dangerous to keep.
Keyword = TGR_MO_Toxins|Potion|VendorItemPoison
; OCF Failsafe for Poisons
Keyword = TGR_MO_Toxins|Potion|OCF_AlchPoison
; Specific Toxic Ingredients (Stacks with Global Surplus for extra cheapness)
Keyword = TGR_MO_Toxins|Ingredient|*Deathbell, *Nightshade, *Arril, *Harrada

; SUPERSTITION (Magical Protection)
; Logic: People are scared of the swamp and buy protection (Soul Gems, Scrolls, Spells).
Keyword = TGR_MO_MagicDemand|Misc|VendorItemSoulGem
Keyword = TGR_MO_MagicDemand|Book|VendorItemSpellTome, VendorItemScroll
; ADDED: Wildcard Safety for Scrolls (Catches modded scrolls)
Keyword = TGR_MO_MagicDemand|Book|*Scroll

; IMPORTED STEEL
; Logic: No smith to refine steel; finished goods are expensive imports.
; Weapons
Keyword = TGR_MO_ImportedSteel|Weapon|WeapMaterialSteel, WeapMaterialSilver, WeapMaterialDwarven, WeapMaterialElven, WeapMaterialOrcish
; Armor
Keyword = TGR_MO_ImportedSteel|Armor|ArmorMaterialSteel, ArmorMaterialSteelPlate, ArmorMaterialScaled
Keyword = TGR_MO_ImportedSteel|Armor|ArmorMaterialDwarven, ArmorMaterialElven, ArmorMaterialElvenSplinted, ArmorMaterialOrcish

; LUMBER MILL
; Logic: Morthal has a working mill. Wood is not as cheap as Falkreath, but not a deficit.
Keyword = TGR_MO_Lumber|Misc|VendorItemFirewood
Keyword = TGR_MO_Lumber|Misc|*Sawn Log
; OCF Failsafe
Keyword = TGR_MO_Lumber|Misc|OCF_FL_TREE_WoodSource