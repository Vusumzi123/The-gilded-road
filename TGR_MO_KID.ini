; =======================================================================================
; MORTHAL TRADE GOODS DISTRIBUTOR
; =======================================================================================

; ---------------------------------------------------------------------------------------
; MORTHAL GLOBAL MODIFIERS
; ---------------------------------------------------------------------------------------
;  Surplus Alchemy (Swamp rarities) 
Keyword = TGR_MO_GlobalSurplus|Potion|TGR_AlchemyFlora
Keyword = TGR_MO_GlobalSurplus|Ingredient|TGR_AlchemyFlora

; Deficit Heavy Industry,  Magic & Arcana.
Keyword = TGR_MO_GlobalDeficit|Misc Item|TGR_HeavyIndustry
Keyword = TGR_MO_GlobalDeficit|Weapon|TGR_HeavyIndustry
Keyword = TGR_MO_GlobalDeficit|Armor|TGR_HeavyIndustry
Keyword = TGR_MO_GlobalDeficit|Scroll|TGR_MagicArcana
Keyword = TGR_MO_GlobalDeficit|Soul Gem|TGR_MagicArcana
Keyword = TGR_MO_GlobalDeficit|Weapon|TGR_MagicArcana


; ---------------------------------------------------------------------------------------
; SPECIFIC CATEGORIES
; ---------------------------------------------------------------------------------------

; TOXIC FLORA (Poisons & Ingredients)
; Logic: Dangerous ingredients are common; Poisons are cheap to make but dangerous to keep.
Keyword = TGR_MO_Toxins|Potion|VendorItemPoison
; OCF Failsafe for Poisons
Keyword = TGR_MO_Toxins|Potion|OCF_AlchPoison
; Specific Toxic Ingredients (Stacks with Global Surplus for extra cheapness)
Keyword = TGR_MO_Toxins|Ingredient|*Deathbell
Keyword = TGR_MO_Toxins|Ingredient|*Nightshade
Keyword = TGR_MO_Toxins|Ingredient|*Arril
Keyword = TGR_MO_Toxins|Ingredient|*Harrada

; SUPERSTITION (Magical Protection)
; Logic: People are scared of the swamp and buy protection (Soul Gems, Scrolls, Spells).
Keyword = TGR_MO_MagicDemand|Soul Gem|VendorItemSoulGem
Keyword = TGR_MO_MagicDemand|Book|VendorItemSpellTome
Keyword = TGR_MO_MagicDemand|Scroll|VendorItemScroll
; ADDED: Wildcard Safety for Scrolls (Catches modded scrolls)
Keyword = TGR_MO_MagicDemand|Book|*Scroll

; IMPORTED STEEL
; Logic: No smith to refine steel; finished goods are expensive imports.
; Weapons
Keyword = TGR_MO_ImportedSteel|Weapon|WeapMaterialSteel
Keyword = TGR_MO_ImportedSteel|Weapon|WeapMaterialSilver
Keyword = TGR_MO_ImportedSteel|Weapon|WeapMaterialDwarven
Keyword = TGR_MO_ImportedSteel|Weapon|WeapMaterialElven
Keyword = TGR_MO_ImportedSteel|Weapon|WeapMaterialOrcish
; Armor
Keyword = TGR_MO_ImportedSteel|Armor|ArmorMaterialSteel
Keyword = TGR_MO_ImportedSteel|Armor|ArmorMaterialSteelPlate
Keyword = TGR_MO_ImportedSteel|Armor|ArmorMaterialScaled
Keyword = TGR_MO_ImportedSteel|Armor|ArmorMaterialDwarven
Keyword = TGR_MO_ImportedSteel|Armor|ArmorMaterialElven
Keyword = TGR_MO_ImportedSteel|Armor|ArmorMaterialElvenSplinted
Keyword = TGR_MO_ImportedSteel|Armor|ArmorMaterialOrcish

; LUMBER MILL
; Logic: Morthal has a working mill. Wood is not as cheap as Falkreath, but not a deficit.
Keyword = TGR_MO_Lumber|Misc Item|VendorItemFirewood
Keyword = TGR_MO_Lumber|Misc Item|*Sawn Log
; OCF Failsafe
Keyword = TGR_MO_Lumber|Misc Item|OCF_FL_TREE_WoodSource