; =======================================================================================
; DAWNSTAR (THE PALE) TRADE GOODS DISTRIBUTOR
; =======================================================================================

; ---------------------------------------------------------------------------------------
; DAWNSTAR GLOBAL MODIFIERS
; ---------------------------------------------------------------------------------------
; GLOBAL SURPLUS: Ores (Iron/Quicksilver) and Iron Weapons
Keyword = TGR_DA_GlobalSurplus|Misc Item|VendorItemOreIngot
Keyword = TGR_DA_GlobalSurplus|Weapon|WeapMaterialIron
Keyword = TGR_DA_GlobalSurplus|Weapon|*Iron
; 1. QUICKSILVER RUSH
; Elven weapons use Quicksilver, so they might be cheaper here too (Lore flavor)
Keyword = TGR_DA_GlobalSurplus|Weapon|WeapMaterialElven
; 2. IRON BREAKER
Keyword = TGR_DA_GlobalSurplus|Misc Item|*Iron Ore, *Iron Ingot
Keyword = TGR_DA_GlobalSurplus|Armor|ArmorMaterialIron, ArmorMaterialBandedIron
; 3. SALT TRADE
Keyword = TGR_DA_GlobalSurplus|Ingredient|*Salt Pile, *Void Salts

; GLOBAL DEFICIT: Food, Wood, Warm Clothing
; 4. THE FROZEN HEARTH
Keyword = TGR_DA_GlobalDeficit|Misc Item|TGR_IsWarmth
Keyword = TGR_DA_GlobalDeficit|Armor|TGR_IsWarmth
Keyword = TGR_DA_GlobalDeficit|Misc Item|Weapons\Torch\torch.nif
Keyword = TGR_DA_GlobalDeficit|Potion|VendorItemFood, VendorItemFoodRaw
; 5. GREEN DEFICIT
Keyword = TGR_DA_GlobalDeficit|Ingredient|TGR_IsCrop
Keyword = TGR_DA_GlobalDeficit|Potion|TGR_IsCrop

; ---------------------------------------------------------------------------------------
; 1. QUICKSILVER RUSH
; ---------------------------------------------------------------------------------------
; Stacks with Global Surplus (0.7 * 0.8 = 0.56 Effective Buy)
Keyword = TGR_DA_Quicksilver|Misc Item|*Quicksilver
; Elven weapons use Quicksilver, so they might be cheaper here too (Lore flavor)
Keyword = TGR_DA_Quicksilver|Weapon|WeapMaterialElven

; ---------------------------------------------------------------------------------------
; 2. IRON BREAKER
; ---------------------------------------------------------------------------------------
; Stacks with Global Surplus (0.7 * 0.9 = 0.63 Effective Buy)
Keyword = TGR_DA_IronBreaker|Misc Item|*Iron Ore, *Iron Ingot
Keyword = TGR_DA_IronBreaker|Weapon|WeapMaterialIron
Keyword = TGR_DA_IronBreaker|Armor|ArmorMaterialIron, ArmorMaterialBandedIron

; ---------------------------------------------------------------------------------------
; 3. SALT TRADE
; ---------------------------------------------------------------------------------------
; Overrides Global (Not an Ore, but a specific surplus)
Keyword = TGR_DA_SaltTrade|Ingredient|*Salt Pile, *Void Salts

; ---------------------------------------------------------------------------------------
; 4. THE FROZEN HEARTH
; ---------------------------------------------------------------------------------------
; Stacks with Global Deficit (1.5 * 1.4 = 2.1 Effective Buy)
; Uses Warmth Helper
Keyword = TGR_DA_FrozenHearth|Misc Item|TGR_IsWarmth
Keyword = TGR_DA_FrozenHearth|Armor|TGR_IsWarmth
; Torches are life-saving here
Keyword = TGR_DA_FrozenHearth|Misc Item|Weapons\Torch\torch.nif

; ---------------------------------------------------------------------------------------
; 5. GREEN DEFICIT
; ---------------------------------------------------------------------------------------
; Stacks with Global Deficit (1.5 * 1.3 = 1.95 Effective Buy)
; Uses Crop Helper
Keyword = TGR_DA_GreenDeficit|Ingredient|TGR_IsCrop
Keyword = TGR_DA_GreenDeficit|Potion|TGR_IsCrop