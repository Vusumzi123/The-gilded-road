; ---------------------------------------------------------------------------------------
; The "War Forge" (Windhelm)
; WINDHELM GLOBAL MODIFIERS
; ---------------------------------------------------------------------------------------
; Surplus: Heavy Industry, Provisions (Only Meat/Alcohol).
Keyword = TGR_WH_GlobalSurplus|Misc Item|TGR_HeavyIndustry
Keyword = TGR_WH_GlobalSurplus|Weapon|TGR_HeavyIndustry
Keyword = TGR_WH_GlobalSurplus|Armor|TGR_HeavyIndustry
Keyword = TGR_WH_GlobalSurplus|Potion|TGR_AlchemyFlora
Keyword = TGR_WH_GlobalSurplus|Ingredient|TGR_AlchemyFlora

; Deficit: Alchemy & Flora, Luxury & Apparel.
Keyword = TGR_WH_GlobalDeficit|Armor|TGR_LuxuryApparel
Keyword = TGR_WH_GlobalDeficit|Misc Item|TGR_LuxuryApparel
Keyword = TGR_WH_GlobalDeficit|Potion|TGR_Provisions
Keyword = TGR_WH_GlobalDeficit|Ingredient|TGR_Provisions
Keyword = TGR_WH_GlobalDeficit|Misc Item|TGR_Provisions
Keyword = TGR_WH_GlobalDeficit|Armor|TGR_Provisions


; ---------------------------------------------------------------------------------------
; SPECIFIC CATEGORIES
; ---------------------------------------------------------------------------------------

; ---------------------------------------------------------------------------------------
; 1. GLOOMBOUND MONOPOLY (Ebony)
