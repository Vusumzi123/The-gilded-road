; ---------------------------------------------------------------------------------------
; 5. BASIC UTILITY GEAR (Iron/Steel, Common Clothes)
; ---------------------------------------------------------------------------------------
; --- WEAPONS ---
; Logic: Distribute to Weapons that have WeapMaterialIron
Keyword = TGR_WR_BasicUtilityGear|Weapon|WeapMaterialIron
; Logic: Distribute to Weapons that have WeapMaterialSteel
Keyword = TGR_WR_BasicUtilityGear|Weapon|WeapMaterialSteel
; --- ARMOR / CLOTHES ---
; Common Clothes [Armor]
Keyword = TGR_WR_BasicUtilityGear|Armor|VendorItemClothing+ClothingPoor
; Hide Armor [Armor]
Keyword = TGR_WR_BasicUtilityGear|Armor|VendorItemArmor+ArmorMaterialHide
; Iron Armor [Armor]
Keyword = TGR_WR_BasicUtilityGear|Armor|VendorItemArmor+ArmorMaterialIron
; --- INGOTS (Misc) ---
; Iron Steel Ingots/Ore
Keyword = TGR_WR_BasicUtilityGear|Misc Item|Iron Ingot
Keyword = TGR_WR_BasicUtilityGear|Misc Item|Iron Ore
Keyword = TGR_WR_BasicUtilityGear|Misc Item|Steel Ingot
Keyword = TGR_WR_BasicUtilityGear|Misc Item|Steel Ore

