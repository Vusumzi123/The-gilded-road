; =======================================================================================
; SOLITUDE (HAAFINGAR) TRADE GOODS DISTRIBUTOR
; =======================================================================================

; ---------------------------------------------------------------------------------------
; SOLITUDE GLOBAL MODIFIERS
; ---------------------------------------------------------------------------------------
; GLOBAL SURPLUS: Luxury Goods (Port City)
Keyword = TGR_SO_GlobalSurplus|Armor|TGR_IsLuxury
Keyword = TGR_SO_GlobalSurplus|Potion|TGR_IsLuxury

; GLOBAL DEFICIT: Raw Materials (No production, high consumption)
Keyword = TGR_SO_GlobalDeficit|Misc|VendorItemOreIngot, VendorItemAnimalHide
Keyword = TGR_SO_GlobalDeficit|Ingredient|VendorItemIngredient

; ---------------------------------------------------------------------------------------
; 1. EAST EMPIRE SATURATION (Market Flooded)
; ---------------------------------------------------------------------------------------
; Stacks with Global Surplus (0.9 * 0.8 = 0.72 Effective Buy)
; Spiced Wine
Keyword = TGR_SO_EastEmpire|Potion|*Spiced Wine, 0xC5348
; Specific Fine Clothes (Common "Rich" items)
Keyword = TGR_SO_EastEmpire|Armor|*Fine Clothes, *Fine Hat
; Silver/Gold Necklaces (Very common in Solitude)
Keyword = TGR_SO_EastEmpire|Armor|*Silver Necklace, *Gold Necklace

; ---------------------------------------------------------------------------------------
; 2. LEGION SUPPLY (War Effort)
; ---------------------------------------------------------------------------------------
; Stacks with Global Deficit.
; Iron/Steel Ingots
Keyword = TGR_SO_LegionSupply|Misc|0x5ACE4, 0x5ACE5
; Iron/Steel Weapons
Keyword = TGR_SO_LegionSupply|Weapon|WeapMaterialIron, WeapMaterialSteel
; Arrows (Consumables for war)
Keyword = TGR_SO_LegionSupply|Ammo|VendorItemArrow

; ---------------------------------------------------------------------------------------
; 3. NOBLE MATERIALS (Jeweler Demand)
; ---------------------------------------------------------------------------------------
; Stacks with Global Deficit.
; Precious Metals (Ingots)
Keyword = TGR_SO_NobleMaterials|Misc|0x5ACDE, 0x5AD9E, 0x5ACE3, 0x5ACDF
; Gems (Loose gems, not jewelry)
Keyword = TGR_SO_NobleMaterials|Misc|VendorItemGem

; ---------------------------------------------------------------------------------------
; 4. FUR FASHION (Rugged Trends)
; ---------------------------------------------------------------------------------------
; Stacks with Global Deficit.
; Bear Pelts (Snow, Cave, Regular)
Keyword = TGR_SO_FurFashion|Misc|*Bear Pelt
; Sabre Cat parts
Keyword = TGR_SO_FurFashion|Misc|*Sabre Cat
; Wolf Pelts
Keyword = TGR_SO_FurFashion|Misc|*Wolf Pelt
; OCF Compatibility
Keyword = TGR_SO_FurFashion|Misc|OCF_ResourceAnimalHide, OCF_ResourceAnimalPelt

; ---------------------------------------------------------------------------------------
; 5. MAGIC BAN (Potema Stigma)
; ---------------------------------------------------------------------------------------
; Dangerous Necromancy items (Trash prices)
; Daedra Heart
Keyword = TGR_SO_MagicBan|Ingredient|0x3AD5B
; Black Soul Gem
Keyword = TGR_SO_MagicBan|SoulGem|0x2E500, 0x2E504
; Human Flesh / Human Heart
Keyword = TGR_SO_MagicBan|Ingredient|0x1016B3, 0xB18CD
; Forbidden Knowledge (Conjuration Spell Tomes)
; Catches: "Spell Tome: Conjure...", "Spell Tome: Raise Zombie", "Spell Tome: Bound Sword"
Keyword = TGR_SO_MagicBan|Book|*Conjure, *Reanimate, *Raise Zombie, *Soul Trap, *Banish, *Command Daedra, *Thrall, *Dead, *Necromancy, *Bound Sword, *Bound Axe, *Bound Bow
; OCF Compatibility (Catches all Conjuration Tomes if OCF is installed)
Keyword = TGR_SO_MagicBan|Book|OCF_BookSpellTomeConjuration