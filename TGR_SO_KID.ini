; =======================================================================================
; SOLITUDE (HAAFINGAR) TRADE GOODS DISTRIBUTOR
; =======================================================================================

; ---------------------------------------------------------------------------------------
; SOLITUDE GLOBAL SURPLUS/DEFICIT
; ---------------------------------------------------------------------------------------
; GLOBAL SURPLUS: Luxury Goods (Port City)
Keyword = TGR_SO_GlobalSurplus|Armor|TGR_LuxuryApparel
Keyword = TGR_SO_GlobalSurplus|Misc Item|TGR_LuxuryApparel
Keyword = TGR_SO_GlobalSurplus|Book|TGR_MagicArcana
Keyword = TGR_SO_GlobalSurplus|Scroll|TGR_MagicArcana
Keyword = TGR_SO_GlobalSurplus|Soul Gem|TGR_MagicArcana
Keyword = TGR_SO_GlobalSurplus|Weapon|TGR_MagicArcana


; GLOBAL DEFICIT: Raw Materials (No production, high consumption)
Keyword = TGR_SO_GlobalDeficit|Misc Item|TGR_HeavyIndustry
Keyword = TGR_SO_GlobalDeficit|Weapon|TGR_HeavyIndustry
Keyword = TGR_SO_GlobalDeficit|Armor|TGR_HeavyIndustry
Keyword = TGR_SO_GlobalDeficit|Potion|TGR_Provisions
Keyword = TGR_SO_GlobalDeficit|Ingredient|TGR_Provisions
Keyword = TGR_SO_GlobalDeficit|Misc Item|TGR_Provisions
Keyword = TGR_SO_GlobalDeficit|Armor|TGR_Provisions

; ---------------------------------------------------------------------------------------
; SPECIFIC CATEGORIES
; ---------------------------------------------------------------------------------------

; ---------------------------------------------------------------------------------------
; 1. EAST EMPIRE SATURATION (Market Flooded)
; ---------------------------------------------------------------------------------------
; Stacks with Global Surplus (0.9 * 0.8 = 0.72 Effective Buy)
; Spiced Wine
Keyword = TGR_SO_EastEmpire|Potion|*Spiced Wine
Keyword = TGR_SO_EastEmpire|Potion|0xC5348
; Specific Fine Clothes (Common "Rich" items)
Keyword = TGR_SO_EastEmpire|Armor|*Fine Clothes
Keyword = TGR_SO_EastEmpire|Armor|*Fine Hat
; Silver/Gold Necklaces (Very common in Solitude)
Keyword = TGR_SO_EastEmpire|Armor|*Silver Necklace
Keyword = TGR_SO_EastEmpire|Armor|*Gold Necklace

; ---------------------------------------------------------------------------------------
; 2. LEGION SUPPLY (War Effort)
; ---------------------------------------------------------------------------------------
; Stacks with Global Deficit.
; Iron/Steel Ingots
Keyword = TGR_SO_LegionSupply|Misc Item|0x5ACE4, 0x5ACE5
; Iron/Steel Weapons
Keyword = TGR_SO_LegionSupply|Weapon|WeapMaterialIron
Keyword = TGR_SO_LegionSupply|Weapon|WeapMaterialSteel
; Arrows (Consumables for war)
Keyword = TGR_SO_LegionSupply|Ammo|VendorItemArrow
Keyword = TGR_FA_Timber|Misc Item|*Firewood

; ---------------------------------------------------------------------------------------
; 3. NOBLE MATERIALS (Jeweler Demand)
; ---------------------------------------------------------------------------------------
; Stacks with Global Deficit.
; Precious Metals (Ingots)
Keyword = TGR_SO_NobleMaterials|Misc Item|0x5ACDE
Keyword = TGR_SO_NobleMaterials|Misc Item|0x5AD9E
Keyword = TGR_SO_NobleMaterials|Misc Item|0x5ACE3
Keyword = TGR_SO_NobleMaterials|Misc Item|0x5ACDF
; Gems (Loose gems, not jewelry)
Keyword = TGR_SO_NobleMaterials|Misc Item|VendorItemGem
; Targets Black-Briar specific items (Vanilla + Modded clones)
Keyword = TGR_SO_NobleMaterials|Potion|*Black-Briar
Keyword = TGR_SO_NobleMaterials|Potion|*Black Briar

; ---------------------------------------------------------------------------------------
; 4. FUR FASHION (Rugged Trends)
; ---------------------------------------------------------------------------------------
; Stacks with Global Deficit.
; Bear Pelts (Snow, Cave, Regular)
Keyword = TGR_SO_FurFashion|Misc Item|*Bear Pelt
; Sabre Cat parts
Keyword = TGR_SO_FurFashion|Misc Item|*Sabre Cat
; Wolf Pelts
Keyword = TGR_SO_FurFashion|Misc Item|*Wolf Pelt
; OCF Compatibility
Keyword = TGR_SO_FurFashion|Misc Item|OCF_ResourceAnimalHide, OCF_ResourceAnimalPelt

; ---------------------------------------------------------------------------------------
; 5. MAGIC BAN (Potema Stigma)
