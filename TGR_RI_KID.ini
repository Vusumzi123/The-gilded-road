; =======================================================================================
; RIFTEN (THE RIFT) TRADE GOODS DISTRIBUTOR
; =======================================================================================

; ---------------------------------------------------------------------------------------
; RIFTEN GLOBAL MODIFIERS
; ---------------------------------------------------------------------------------------
; GLOBAL SURPLUS: Alcohol (Vice City) - uses helper keyword
Keyword = TGR_RI_GlobalSurplus|Potion|TGR_IsAlcohol
; GLOBAL SURPLUS: Ingredients (Lush environment)
Keyword = TGR_RI_GlobalSurplus|Ingredient|VendorItemIngredient
; GlOBAL SURPLUS: FISH (Lake and River Abundance) - uses helper keyword
Keyword = TGR_RI_GlobalSurplus|Ingredient|TGR_IsFish
; 3. THIEVES MARKET (Stolen/Light Gear)
Keyword = TGR_RI_GlobalSurplus|Armor|ArmorLight
Keyword = TGR_RI_GlobalSurplus|Misc Item|0xA
Keyword = TGR_RI_GlobalSurplus|Potion|*Poison
Keyword = TGR_RI_GlobalSurplus|Potion|OCF_AlchemyPoison


; GLOBAL DEFICIT: Heavy Industry (No mines)
; HEAVY METAL DEFICIT (Iron/Steel Specifics)
Keyword = TGR_RI_GlobalDeficit|Weapon|WeapMaterialIron, WeapMaterialSteel
Keyword = TGR_RI_GlobalDeficit|Misc Item|VendorItemOreIngot
Keyword = TGR_RI_GlobalDeficit|Armor|ArmorHeavy
Keyword = TGR_RI_GlobalDeficit|Weapon|WeapTypeGreatsword, WeapTypeBattleaxe, WeapTypeWarhammer
; 5. EXOTIC IMPORTS (Drugs - Deficit despite being vice)
Keyword = TGR_RI_GlobalDeficit|Potion|0x57A7A, 0x3560~Dawnguard.esm
Keyword = TGR_RI_GlobalDeficit|Ingredient|0xD8E3F
Keyword = TGR_RI_GlobalDeficit|Potion|0xAF535
Keyword = TGR_RI_GlobalDeficit|Potion|TGR_IsDrug

; ---------------------------------------------------------------------------------------
; SPECIFIC CATEGORIES
; ---------------------------------------------------------------------------------------

; ---------------------------------------------------------------------------------------
; 1. BLACK-BRIAR MONOPOLY (Massive Surplus)
; ---------------------------------------------------------------------------------------
; Targets Black-Briar specific items (Vanilla + Modded clones)
Keyword = TGR_RI_BlackBriar|Potion|*Black-Briar, *Black Briar

; ---------------------------------------------------------------------------------------
; 2. LAKE BOUNTY (Fish & Scales)
; ---------------------------------------------------------------------------------------
; Salmon and derived products
Keyword = TGR_RI_LakeBounty|Potion|*Salmon
; Slaughterfish Egg, Scales
Keyword = TGR_RI_LakeBounty|Ingredient|*Slaughterfish
; Rift-Specific Fish (Histcarp, River Betty, Silverside Perch)
Keyword = TGR_RI_LakeBounty|Ingredient|0x106E18, 0x106E19, 0x106E1C
; General Fish (Cyrodilic Spadetail, Abecean Longfin)
Keyword = TGR_RI_LakeBounty|Ingredient|0x106E19, 0x106E1B

; ---------------------------------------------------------------------------------------
; 3. THIEVES MARKET (Stolen/Light Gear)
; ---------------------------------------------------------------------------------------
; Light Armor (Leather, Hide, Scaled, Glass)
Keyword = TGR_RI_ThievesMarket|Armor|ArmorLight
; Lockpicks
Keyword = TGR_RI_ThievesMarket|Misc Item|0xA
; Poisons (Wildcard + OCF)
Keyword = TGR_RI_ThievesMarket|Potion|*Poison
Keyword = TGR_RI_ThievesMarket|Potion|OCF_AlchemyPoison

; ---------------------------------------------------------------------------------------
; 4. HEAVY METAL DEFICIT (Iron/Steel Specifics)
; ---------------------------------------------------------------------------------------
; Iron Ingot
Keyword = TGR_RI_HeavyDeficit|Misc Item|0x5ACE4
; Steel Ingot
Keyword = TGR_RI_HeavyDeficit|Misc Item|0x5ACE5
; Iron/Steel Weapons
Keyword = TGR_RI_HeavyDeficit|Weapon|WeapMaterialIron, WeapMaterialSteel

; ---------------------------------------------------------------------------------------
; 5. EXOTIC IMPORTS (Drugs - Deficit despite being vice)
; ---------------------------------------------------------------------------------------
; Skooma (Vanilla + Redwater)
Keyword = TGR_RI_ExoticImports|Potion|0x57A7A, 0x3560~Dawnguard.esm
; Moon Sugar
Keyword = TGR_RI_ExoticImports|Ingredient|0xD8E3F
; Sleeping Tree Sap
Keyword = TGR_RI_ExoticImports|Potion|0xAF535
; OCF Soft Dependency (Catches modded drugs)
Keyword = TGR_RI_ExoticImports|Potion|TGR_IsDrug