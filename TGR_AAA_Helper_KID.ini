; ---------------------------------------------------------------------------------------
; 0. HELPER KEYWORDS (Soft Dependency Setup)
; ---------------------------------------------------------------------------------------
; Method 1: Wildcards (Works for everyone)
Keyword = TGR_IsAlcohol|Potion|*Mead, *Ale, *Wine, *Brandy, *Sujamma, *Flin, *Greef, *Shein, *Mazte
; Method 2: OCF Compatibility (If OCF is installed, this catches everything else)
Keyword = TGR_IsAlcohol|Potion|OCF_AlchDrinkAlcohol
; Vanilla Potion/Food Wildcards (Matches "Salmon Steak", "Seared Slaughterfish", etc.)
Keyword = TGR_IsFish|Potion|*Salmon, *Slaughterfish, *Fish, *Crab, *Clam
; Vanilla Ingredient Wildcards (Matches specific fish species names found in ingredients)
Keyword = TGR_IsFish|Ingredient|*Histcarp, *River Betty, *Perch, *Longfin, *Spadetail, *Slaughterfish, *Salmon, *Pearl
; OCF Soft Dependency (Catches modded fish)
Keyword = TGR_IsFish|Ingredient|OCF_AlchFood_Fish, OCF_AlchFood_FishRaw, OCF_AlchFood_SeafoodRaw
; OCF Soft Dependency (Catches modded food fish)
Keyword = TGR_IsFish|Potion|OCF_AlchFood_Fish, OCF_AlchFood_FishRaw, OCF_AlchFood_SeafoodRaw
; OCF Soft Dependency (Catches modded drugs)
Keyword = TGR_IsDrug|Potion|OCF_AlchDrugSkooma, OCF_IngrPlant_MoonSugar    
; Vanilla Bread Wildcards (Matches "Bread", "Loaf", "Tart", etc.)
Keyword = TGR_IsBread|Potion|*Bread, *Loaf, *Tart, *Crostata, *Baguette
; 2. Flour
Keyword = TGR_IsBread|Ingredient|*Flour
; OCF Soft Dependency (Catches Bread from mods)
Keyword = TGR_IsBread|Potion|OCF_AlchFood_Bread
; Rich Clothing (Wildcards matches "Fine Clothes", "Noble Tunic", "Jarl's Robes")
Keyword = TGR_IsLuxury|Armor|*Fine Clothes, *Fine Boots, *Fine Hat, *Noble, *Jarl, *Emperor, *Rich
; Jewelry (Matches Gold, Silver, Gems in names)
Keyword = TGR_IsLuxury|Armor|*Ring, *Necklace, *Circlet, *Amulet, *Gold, *Silver, *Garnet, *Ruby, *Sapphire, *Emerald, *Diamond
; Jewelry [Armor]
Keyword = TGR_IsLuxury|Armor|VendorItemJewelry
; Expensive Drinks
Keyword = TGR_IsLuxury|Potion|*Spiced Wine, *Colovian Brandy, *Surilie
; Gems [Misc/Gem]
Keyword = TGR_IsLuxury|Misc|VendorItemGem
; OCF Compatibility (Catches modded luxury items)
Keyword = TGR_IsLuxury|Armor|ClothingRich, OCF_AccessoryJewelry
; Since OCF lacks a specific "Raw Crop" keyword, we list the vanilla crops manually.
; 1. Raw Ingredients (The "Starvation" list)
Keyword = TGR_IsCrop|Ingredient|*Wheat, *Potato, *Cabbage, *Leek, *Gourd, *Carrot, *Lettuce, *Tomato, *Ash Yam, *Pumpkin
Keyword = TGR_IsCrop|Potion|*Potato, *Cabbage, *Leek, *Gourd, *Carrot, *Tomato, *Ash Yam
; WARMTH HELPER (For Frozen Hearth)
Keyword = TGR_IsWarmth|Misc|VendorItemFirewood
Keyword = TGR_IsWarmth|Armor|*Fur Armor, *Fur Boots, *Fur Gauntlets, *Fur Helmet
Keyword = TGR_IsWarmth|Misc|*Bear Pelt, *Wolf Pelt, *Fox Pelt, *Sabre Cat
Keyword = TGR_IsWarmth|Armor|Survival_ArmorWarm, WAF_ClothingCloak, OCF_BodyTypeCloak
