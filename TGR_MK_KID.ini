; =======================================================================================
; MARKARTH (THE REACH) TRADE GOODS DISTRIBUTOR
; =======================================================================================

; ---------------------------------------------------------------------------------------
; MARKARTH GLOBAL MODIFIERS
; The "Stone City" (Markarth)
; ---------------------------------------------------------------------------------------
; Surplus: Heavy Industry (Silver/Gold focus), Dwemer Artifacts.
Keyword = TGR_MK_GlobalSurplus|Misc Item|TGR_HeavyIndustry
Keyword = TGR_MK_GlobalSurplus|Weapon|TGR_HeavyIndustry
Keyword = TGR_MK_GlobalSurplus|Armor|TGR_HeavyIndustry
Keyword = TGR_MK_GlobalSurplus|Misc Item|TGR_DwemerArtifacts
Keyword = TGR_MK_GlobalSurplus|Armor|TGR_DwemerArtifacts
Keyword = TGR_MK_GlobalSurplus|Weapon|TGR_DwemerArtifacts
Keyword = TGR_MK_GlobalSurplus|Ingredient|TGR_DwemerArtifacts
; Added quarry stone and clay to compensate for Construction deficit
Keyword = TGR_MK_GlobalSurplus|Misc Item|*Stone
Keyword = TGR_MK_GlobalSurplus|Misc Item|*Clay

; Deficit: Provisions, Construction & Fuel (Wood).
Keyword = TGR_MK_GlobalDeficit|Misc Item|TGR_ConstructionFuel
Keyword = TGR_MK_GlobalDeficit|Potion|TGR_Provisions
Keyword = TGR_MK_GlobalDeficit|Ingredient|TGR_Provisions
Keyword = TGR_MK_GlobalDeficit|Misc Item|TGR_Provisions
Keyword = TGR_MK_GlobalDeficit|Armor|TGR_Provisions

; ---------------------------------------------------------------------------------------
; SPECIFIC CATEGORIES
; ---------------------------------------------------------------------------------------

; ---------------------------------------------------------------------------------------
; 1. SILVER-BLOOD MONOPOLY (Specific Ores - Massive Surplus)
; ---------------------------------------------------------------------------------------
; Gold [Misc]
Keyword = TGR_MK_SilverBlood|Misc Item|*Gold
; Silver and Silverware [Misc]
Keyword = TGR_MK_SilverBlood|Misc Item|*Silver

; ---------------------------------------------------------------------------------------
; 2. DWEMER TECH FLOOD (Scrap & Gear)
; ---------------------------------------------------------------------------------------
; Dwarven Metal Ingot [Misc]
Keyword = TGR_MK_DwemerTech|Misc Item|0xDB8A2
; Dwemer Scrap/Clutter [Misc] - Target anything with "Dwemer" or "Dwarven" in the name
Keyword = TGR_MK_DwemerTech|Misc Item|*Dwemer
Keyword = TGR_MK_DwemerTech|Misc Item|*Dwarven
; Dwarven Weapons [Weapon] - Target all Dwarven material weapons
Keyword = TGR_MK_DwemerTech|Weapon|WeapMaterialDwarven
; Dwarven Armor [Armor] - Target all Dwarven material armor
Keyword = TGR_MK_DwemerTech|Armor|ArmorMaterialDwarven

; ---------------------------------------------------------------------------------------
; 3. REACH FAUNA FLORA (Weeds/Common Ingredients)
; ---------------------------------------------------------------------------------------
; Juniper Berries [Ingredient]
Keyword = TGR_MK_ReachFaunaFlora|Ingredient|0x5076E
; Hanging Moss [Ingredient]
Keyword = TGR_MK_ReachFaunaFlora|Ingredient|0x57F91
; Rock Warbler Egg [Ingredient]
Keyword = TGR_MK_ReachFaunaFlora|Ingredient|0x7E8C8
; Goat Hide [Misc]
Keyword = TGR_MK_ReachFaunaFlora|Misc Item|0x3AD8E
; Goat Horn [Misc]
Keyword = TGR_MK_ReachFaunaFlora|Misc Item|0x00303F~HearthFires.esm
; Saber Cat Pelt [Misc]
Keyword = TGR_MK_ReachFaunaFlora|Misc Item|0x3AD6D
; Saber Cat Tooth [Ingredient]
Keyword = TGR_MK_ReachFaunaFlora|Ingredient|0x6BC04

; ---------------------------------------------------------------------------------------
; 4. IMPORTED PROVISIONS (Specific Food Staples - Expensive)
; ---------------------------------------------------------------------------------------
; Bread [Potion/Food]
Keyword = TGR_MK_ImportedProvisions|Potion|*Bread
; Apples (Red/Green) [Potion/Food]
Keyword = TGR_MK_ImportedProvisions|Potion|*Apple
; Carrots [Potion/Food]
Keyword = TGR_MK_ImportedProvisions|Potion|*Carrot
; Cabbage [Potion/Food]
Keyword = TGR_MK_ImportedProvisions|Potion|*Cabbage
; Horker Meat [Potion/Food] - Imported from the coast
Keyword = TGR_MK_ImportedProvisions|Potion|0x65C9B
; Horker Tusk [Misc] - Imported from the coast
Keyword = TGR_MK_ImportedProvisions|Misc Item|0x3AD68

; ---------------------------------------------------------------------------------------
; 5. TIMBER DEFICIT (Wood, Wooden Gear & Hearthfire Materials)
; ---------------------------------------------------------------------------------------
; Firewood [Misc]
Keyword = TGR_MK_TimberDeficit|Misc Item|0x6F993

; --- HEARTHFIRE MATERIALS ---
; Sawn Log [Misc/Ammo] - Essential for building, imported from mills
Keyword = TGR_MK_TimberDeficit|Misc Item|0x00300E~HearthFires.esm
; Straw [Misc] - Dried plant stalks, scarce in the rocky Reach
Keyword = TGR_MK_TimberDeficit|Misc Item|0x005A68~HearthFires.esm
; Wooden Sword [Weapon] - A wooden toy added by Hearthfire
Keyword = TGR_MK_TimberDeficit|Weapon|0x004D91~HearthFires.esm

; --- WEAPONS & ARMOR ---
; Bows [Weapon]
Keyword = TGR_MK_TimberDeficit|Weapon|WeapTypeBow
; Wooden Shields [Armor] - Target Hide/Iron shields that are mostly wood
; Using the 'ArmorShield' keyword + 'ArmorMaterialIron/Hide' is the safest proxy for wood shields
Keyword = TGR_MK_TimberDeficit|Armor|ArmorShield+ArmorMaterialHide
Keyword = TGR_MK_TimberDeficit|Armor|ArmorShield+ArmorMaterialIron
; Hide and Leather Armor [Armor] - Mostly leather with wood components
Keyword = TGR_MK_TimberDeficit|Armor|ArmorMaterialHide, ArmorMaterialLeather

; ---------------------------------------------------------------------------------------
; 6. FORSWORN TRASH (Savage Gear - Very Low Value)
; ---------------------------------------------------------------------------------------
; Forsworn Weapons [Weapon] - Wildcard matches "Forsworn Sword", "Forsworn Axe", etc.
Keyword = TGR_MK_ForswornGear|Weapon|*Forsworn
; Forsworn Armor [Armor]
Keyword = TGR_MK_ForswornGear|Armor|*Forsworn

; ---------------------------------------------------------------------------------------
; 7. CIVILIZED GOODS (Imports for the wealthy)
; ---------------------------------------------------------------------------------------
; Books [Book] - All books
Keyword = TGR_MK_CivilizedGoods|Book|VendorItemBook
; Paper Rolls [Misc]
Keyword = TGR_MK_CivilizedGoods|Misc Item|*Roll of Paper
; Inkwells [Misc]
Keyword = TGR_MK_CivilizedGoods|Misc Item|*Inkwell
; Fine Clothes [Armor] - Same logic as Whiterun Imports
Keyword = TGR_MK_CivilizedGoods|Armor|VendorItemClothing+ClothingRich