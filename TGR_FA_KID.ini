; =======================================================================================
; FALKREATH TRADE GOODS DISTRIBUTOR
; =======================================================================================

; ---------------------------------------------------------------------------------------
; FALKREATH GLOBAL MODIFIERS
; ---------------------------------------------------------------------------------------
; GLOBAL SURPLUS: Wood, Hides, and Wooden Weaponry.
; Logic: Falkreath's economy is driven by the dense pine forests and hunting.
; Vanilla Keywords
Keyword = TGR_FA_GlobalSurplus|Weapon|WeapTypeBow, WeapTypeStaff
Keyword = TGR_FA_GlobalSurplus|Armor|ArmorMaterialHide, ArmorMaterialStudded, ArmorMaterialLeather
Keyword = TGR_FA_GlobalSurplus|Misc|VendorItemAnimalHide, VendorItemLeather
; OCF Failsafes (From your MD file)
Keyword = TGR_FA_GlobalSurplus|Misc|OCF_FL_TREE_WoodSource

; GLOBAL DEFICIT: Jewelry and Luxury Manufactured Goods.
; Logic: A rural backwater with no "high culture" or luxury industry.
; HELPER KEYWORD: Covers Rings, Necklaces, Circlets, Gems, and Expensive Clothing
Keyword = TGR_FA_GlobalDeficit|Armor|TGR_IsLuxury
Keyword = TGR_FA_GlobalDeficit|Misc|TGR_IsLuxury

; ---------------------------------------------------------------------------------------
; SPECIFIC CATEGORIES
; ---------------------------------------------------------------------------------------

; PINE FOREST (Timber)
; Logic: Firewood and lumber are "everywhere and dirt cheap".
Keyword = TGR_FA_Timber|Misc|VendorItemFirewood
; Hearthfire Construction Materials (Non-Metal)
; Matches "Sawn Log", "Quarried Stone", "Clay", "Straw", "Glass"
Keyword = TGR_FA_Timber|Misc|*Sawn Log, *Quarried Stone, *Clay, *Straw, *Glass
; OCF Failsafe
Keyword = TGR_FA_Timber|Misc|OCF_FL_TREE_WoodSource

; HUNTER'S BOUNTY
; Logic: Hunting is the primary food source; meat and pelts are abundant.
Keyword = TGR_FA_Hunters|Ingestible|VendorItemFoodRaw
Keyword = TGR_FA_Hunters|Misc|VendorItemAnimalHide

; METAL SCARCITY (No Mining)
; Logic: No significant mines. Ores and Ingots must be imported.
Keyword = TGR_FA_NoMining|Misc|VendorItemOreIngot

; ACADEMIC DROUGHT
; Logic: No college or academic presence. Books and magic are imported luxuries.
Keyword = TGR_FA_Academic|Book|VendorItemBook, VendorItemSpellTome, VendorItemRecipe

; LOCAL SMITHING (Iron/Steel Deficit)
; Logic: Blacksmiths must import raw iron/steel, raising the price of finished metal goods.
Keyword = TGR_FA_Smithing|Weapon|WeapMaterialIron, WeapMaterialSteel
Keyword = TGR_FA_Smithing|Armor|ArmorMaterialIron, ArmorMaterialSteel