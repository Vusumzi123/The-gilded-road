; =======================================================================================
; FALKREATH TRADE GOODS DISTRIBUTOR
; =======================================================================================

; ---------------------------------------------------------------------------------------
; FALKREATH GLOBAL MODIFIERS
; ---------------------------------------------------------------------------------------
; Surplus Construction & Fuel (Timber)
Keyword = TGR_|Misc Item|TGR_ConstructionFuel
Keyword = TGR_FA_GlobalSurplus|Armor|TGR_LightArmory
Keyword = TGR_FA_GlobalSurplus|Weapon|TGR_LightArmory
Keyword = TGR_FA_GlobalSurplus|Misc Item|TGR_LightArmory


; Deficit Magic & Arcana, Heavy Industry.
Keyword = TGR_FA_GlobalDeficit|Scroll|TGR_MagicArcana
Keyword = TGR_FA_GlobalDeficit|Soul Gem|TGR_MagicArcana
Keyword = TGR_FA_GlobalDeficit|Weapon|TGR_MagicArcana
Keyword = TGR_FA_GlobalDeficit|Misc Item|TGR_HeavyIndustry
Keyword = TGR_FA_GlobalDeficit|Weapon|TGR_HeavyIndustry
Keyword = TGR_FA_GlobalDeficit|Armor|TGR_HeavyIndustry


; ---------------------------------------------------------------------------------------
; SPECIFIC CATEGORIES
; ---------------------------------------------------------------------------------------

; PINE FOREST (Timber)
; Logic: Firewood and lumber are "everywhere and dirt cheap".
Keyword = TGR_FA_Timber|Misc Item|VendorItemFirewood
; Hearthfire Construction Materials (Non-Metal)
; Matches "Sawn Log", "Quarried Stone", "Clay", "Straw", "Glass"
Keyword = TGR_FA_Timber|Misc Item|*Sawn Log
; OCF Failsafe
Keyword = TGR_FA_Timber|Misc Item|OCF_FL_TREE_WoodSource

; HUNTER'S BOUNTY
; Logic: Hunting is the primary food source; meat and pelts are abundant.
Keyword = TGR_FA_Hunters|Ingestible|VendorItemFoodUncooked
Keyword = TGR_FA_Hunters|Misc Item|VendorItemAnimalHide

; METAL SCARCITY (No Mining)
; Logic: No significant mines. Ores and Ingots must be imported.
Keyword = TGR_FA_NoMining|Misc Item|VendorItemOreIngot

; ACADEMIC DROUGHT
; Logic: No college or academic presence. Books and magic are imported luxuries.
Keyword = TGR_FA_Academic|Book|VendorItemBook, VendorItemSpellTome, VendorItemRecipe

; LOCAL SMITHING (Iron/Steel Deficit)
; Logic: Blacksmiths must import raw iron/steel, raising the price of finished metal goods.
Keyword = TGR_FA_Smithing|Weapon|WeapMaterialIron, WeapMaterialSteel
Keyword = TGR_FA_Smithing|Armor|ArmorMaterialIron, ArmorMaterialSteel