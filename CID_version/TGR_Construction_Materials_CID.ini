; =======================================================================================
; CONSTRUCTION MATERIALS DISTRIBUTION (CID)
; =======================================================================================
; 1. BASELINE STOCK
; Adds a small amount of building materials to all major General Goods stores in Skyrim.
; Logic: Every store should have a few bricks and logs, but not a stockpile.
; ---------------------------------------------------------------------------------------
[General]
; Whiterun (Belethor)
MerchantWhiterunBelethorsGoodsChest = Firewood01|10
MerchantWhiterunBelethorsGoodsChest = BYOHMaterialClay|5
MerchantWhiterunBelethorsGoodsChest = BYOHMaterialStoneBlock|5

; Solitude (Bits and Pieces)
MerchantSolitudeBitsAndPieces = Firewood01|3
MerchantSolitudeBitsAndPieces = BYOHMaterialClay|5
MerchantSolitudeBitsAndPieces = BYOHMaterialStoneBlock|5

; Markarth (Arnleif and Sons)
; Note: Stone is naturally abundant here.
MerchantMarkarthArnleifAndSonsChest = Firewood01|2
MerchantMarkarthArnleifAndSonsChest = BYOHMaterialClay|30
MerchantMarkarthArnleifAndSonsChest = BYOHMaterialStoneBlock|45

; Riften (Pawned Prawn / Bersi)
MerchantRiftenPawnedPrawnChest = Firewood01|5
MerchantRiftenPawnedPrawnChest = BYOHMaterialClay|5
MerchantRiftenPawnedPrawnChest = BYOHMaterialStoneBlock|5

; Windhelm (Niranye - Market Stand)
MerchantWindhelmNiranyeChest = Firewood01|5
MerchantWindhelmNiranyeChest = BYOHMaterialClay|5
MerchantWindhelmNiranyeChest = BYOHMaterialStoneBlock|5

; Riverwood (Lucan Valerius)
MerchantRiverwoodTraderChest = Firewood01|8
MerchantRiverwoodTraderChest = BYOHMaterialClay|3
MerchantRiverwoodTraderChest = BYOHMaterialStoneBlock|3

; Winterhold (Birna)
MerchantWinterholdBirnaChest = Firewood01|2
MerchantWinterholdBirnaChest = BYOHMaterialClay|2
MerchantWinterholdBirnaChest = BYOHMaterialStoneBlock|2

; =======================================================================================
; 2. FALKREATH SURPLUS (Gray Pine Goods)
; =======================================================================================
; Logic: Falkreath is the timber and material capital. Solaf stocks these in bulk.
; The counts here are much higher than the baseline stores.
; ---------------------------------------------------------------------------------------

; Firewood (Fuel is cheap and abundant)
MerchantFalkreathGrayPineGoodsChest = Firewood01|40

; Construction Materials (Local excavations)
MerchantFalkreathGrayPineGoodsChest = BYOHMaterialClay|30
MerchantFalkreathGrayPineGoodsChest = BYOHMaterialStoneBlock|30

; Sawn Logs (Actual item form)
; We only give these to Falkreath because they are heavy and specific to lumber mills.
MerchantFalkreathGrayPineGoodsChest = BYOHMaterialLog|20