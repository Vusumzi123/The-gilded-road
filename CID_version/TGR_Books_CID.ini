; =======================================================================================
; THE GILDED ROAD - BOOK DISTRIBUTION (CID)
; =======================================================================================
; This file distributes the 9 volumes of "The Gilded Road" to specific merchants.
;
; LOGIC:
; 1. Local Guides: Merchants sell the volume relevant to their own Hold.
; 2. Khajiit Exclusive: Volume IX is only sold by the Caravans.
; 3. Trade Hubs: Solitude and Whiterun stock extra volumes.
; =======================================================================================
[General]
; ---------------------------------------------------------------------------------------
; VOLUME I: WHITERUN (The Hub)
; Sold by Belethor (Whiterun) and Lucan (Riverwood)
; ---------------------------------------------------------------------------------------
MerchantWhiterunBelethorsGoodsChest = TGR_Book_Vol1_Whiterun|1
MerchantRiverwoodTraderChest = TGR_Book_Vol1_Whiterun|1

; ---------------------------------------------------------------------------------------
; VOLUME II: THE REACH (Silver & Stone)
; Sold by Arnleif and Sons (Markarth)
; ---------------------------------------------------------------------------------------
MerchantMarkarthArnleifAndSonsChest = TGR_Book_Vol2_Reach|1

; ---------------------------------------------------------------------------------------
; VOLUME III: THE RIFT (The Golden Gutter)
; Sold by The Pawned Prawn (Riften)
; ---------------------------------------------------------------------------------------
MerchantRiftenPawnedPrawnChest = TGR_Book_Vol3_Rift|1

; ---------------------------------------------------------------------------------------
; VOLUME IV: HAAFINGAR (The Mask of Empire)
; Sold by Bits and Pieces (Solitude)
; ---------------------------------------------------------------------------------------
MerchantSolitudeBitsAndPieces = TGR_Book_Vol4_Solitude|1

; ---------------------------------------------------------------------------------------
; VOLUME V: EASTMARCH (Kings and Traitors)
; Sold by Niranye (Windhelm) - She is the fence/merchant, fits the "shady" tone best.
; ---------------------------------------------------------------------------------------
MerchantWindhelmNiranyeChest = TGR_Book_Vol5_Eastmarch|1

; ---------------------------------------------------------------------------------------
; VOLUME VI: FALKREATH (Dead Man's Market)
; Sold by Gray Pine Goods (Falkreath)
; ---------------------------------------------------------------------------------------
MerchantFalkreathGrayPineGoodsChest = TGR_Book_Vol6_Falkreath|1

; ---------------------------------------------------------------------------------------
; VOLUME VII: HJAALMARCH (The Drowning Town)
; Sold by Lami (Thaumaturgist's Hut) 
; Logic: Morthal has no general store, and the book emphasizes Alchemy.
; ---------------------------------------------------------------------------------------
MerchantMorthalLamiChest = TGR_Book_Vol7_Hjaalmarch|1

; ---------------------------------------------------------------------------------------
; VOLUME VIII: THE NORTHERN COAST (Frozen End)
; Sold by Birna's Oddments (Winterhold)
; ---------------------------------------------------------------------------------------
MerchantWinterholdBirnaChest = TGR_Book_Vol8_North|1

; ---------------------------------------------------------------------------------------
; VOLUME IX: THE WHISPERING CLAW (Trade Partners)
; EXCLUSIVE: Only sold by Khajiit Caravans.
; They also stock random copies of the other guides (smuggled goods).
; ---------------------------------------------------------------------------------------
; Ri'saad's Caravan (Whiterun/Markarth route)
MerchantCaravanChestKhajiitA = TGR_Book_Vol9_Partners|2
MerchantCaravanChestKhajiitA = TGR_Book_Vol1_Whiterun|1
MerchantCaravanChestKhajiitA = TGR_Book_Vol2_Reach|1

; Ma'dran's Caravan (Windhelm/Solitude route)
MerchantCaravanChestKhajiitB = TGR_Book_Vol9_Partners|2
MerchantCaravanChestKhajiitB = TGR_Book_Vol5_Eastmarch|1
MerchantCaravanChestKhajiitB = TGR_Book_Vol4_Solitude|1

; Ahkari's Caravan (Dawnstar/Riften route)
MerchantCaravanChestKhajiitC = TGR_Book_Vol9_Partners|2
MerchantCaravanChestKhajiitC = TGR_Book_Vol8_North|1
MerchantCaravanChestKhajiitC = TGR_Book_Vol3_Rift|1


; =======================================================================================
; THE GILDED ROAD - DUNGEON LOOT DISTRIBUTION (CID)
; =======================================================================================
; Distributes the books into dungeon Boss Chests.
; Logic: Bandits and Warlocks rob merchants or own books.
;
; FORMAT: ContainerID = ItemID, Count, Chance (%)
; =======================================================================================

; ---------------------------------------------------------------------------------------
; BANDIT BOSS CHESTS (The "Stolen Goods" Pool)
; Bandits rob travelers, so they have a chance to have ANY volume.
; ---------------------------------------------------------------------------------------
; 15% chance to find a random volume in a Bandit Boss Chest.
TreasBanditChestBoss = TGR_Book_Vol1_Whiterun|1?15
TreasBanditChestBoss = TGR_Book_Vol2_Reach|1?15
TreasBanditChestBoss = TGR_Book_Vol3_Rift|1?15
TreasBanditChestBoss = TGR_Book_Vol4_Solitude|1?15
TreasBanditChestBoss = TGR_Book_Vol5_Eastmarch|1?15
TreasBanditChestBoss = TGR_Book_Vol6_Falkreath|1?15
TreasBanditChestBoss = TGR_Book_Vol7_Hjaalmarch|1?15
TreasBanditChestBoss = TGR_Book_Vol8_North|1?15

; VERY Rare chance (5%) to find the "Secret" Khajiit Guide (Vol IX)
; implying this bandit leader managed to rob a Khajiit Caravan.
TreasBanditChestBoss = TGR_Book_Vol9_Partners|1?5


; ---------------------------------------------------------------------------------------
; WARLOCK & VAMPIRE CHESTS (The "Educated" Pool)
; Mages and Vampires are often scholars. They prefer the volumes on
; Solitude (Politics), Winterhold (Magic), and Morthal (Alchemy).
; ---------------------------------------------------------------------------------------
; Solitude (Politics/Fine Goods)
TreasWarlockChestBoss = TGR_Book_Vol4_Solitude|1?20
TreasVampireChestBoss = TGR_Book_Vol4_Solitude|1?20

; Winterhold (Magic Trade)
TreasWarlockChestBoss = TGR_Book_Vol8_North|1?25
TreasVampireChestBoss = TGR_Book_Vol8_North|1?25

; Hjaalmarch (Alchemy/Swamp)
TreasWarlockChestBoss = TGR_Book_Vol7_Hjaalmarch|1?20
TreasVampireChestBoss = TGR_Book_Vol7_Hjaalmarch|1?20


; ---------------------------------------------------------------------------------------
; FORSWORN CHESTS (The Reach Pool)
; Forsworn occupy the Reach. They will specifically have the Reach volume (Vol II).
; ---------------------------------------------------------------------------------------
TreasForswornChestBoss = TGR_Book_Vol2_Reach|1?30


; ---------------------------------------------------------------------------------------
; GIANT CHESTS (The "Hoarder" Pool)
; Giants hoard random junk from people they smash.
; ---------------------------------------------------------------------------------------
TreasGiantChestBoss = TGR_Book_Vol1_Whiterun|1?10
TreasGiantChestBoss = TGR_Book_Vol6_Falkreath|1?10
TreasGiantChestBoss = TGR_Book_Vol5_Eastmarch|1?10